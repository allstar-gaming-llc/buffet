---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  {{- if .Values.deployment.replicas }}
  replicas: {{ .Values.deployment.replicas }}
  {{- else if eq .Values.env "prod" }}
  replicas: 2
  {{- else }}
  replicas: 1
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      service: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        resource.opentelemetry.io/service.name: {{ .Release.Name }}
      labels:
        service: {{ .Release.Name }}
    spec:
      {{- if .Values.serviceAccount }}
      serviceAccount: {{ .Values.serviceAccount }}
      {{- end }}
      {{- if .Values.deployment.affinity }}
      affinity: {{- toYaml .Values.deployment.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml .Values.deployment.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.nodeSelector }}
      nodeSelector: {{- toYaml .Values.deployment.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.tolerations }}
      tolerations: {{- toYaml .Values.deployment.tolerations | nindent 8 }}
      {{- end }}
      containers:
      {{- range $name, $container := .Values.deployment.containers }}
      - name: {{ $name }}
        {{- if $container.command }}
        {{- if kindIs "slice" $container.command }}
        command:
        {{- range $el := $container.command }}
        - {{ $el }}
        {{- end }}
        {{- else }}
        command: {{ $container.command }}
        {{- end }}
        {{- end }}
        image: {{ $.Values.image }}
        {{- if $container.resources }}
        resources:
          {{- if $container.resources.requests }}
          requests:
            {{- range $k, $v := $container.resources.requests }}
            {{ $k }}: {{ $v }}
            {{- end }}
          {{- end }}
          {{- if $container.resources.limits }}
          limits:
            {{- range $k, $v := $container.resources.limits }}
            {{ $k }}: {{ $v }}
            {{- end }}
          {{- end }}
        {{- end }}
        env:
        - name: K8S_ENV
          value: {{ $.Values.env }}
        {{- range $k, $v := $container.configMapEnv }}
        - name: {{ $k }}
          valueFrom:
            configMapKeyRef:
              name: {{ $.Release.Name }}
              key: {{ $v }}
        {{- end }}
        {{- range $k, $v := $container.secretEnv }}
        - name: {{ $k }}
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}
              key: {{ $v }}
        {{- end }}
        {{- range $k, $v := $container.staticEnv }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}
        {{- if $container.ports }}
        ports:
        {{- range $k, $v := $container.ports }}
        - name: {{ $k }}
          containerPort: {{ $v }}
        {{- end }}
        {{- end }}
        {{- if $container.startupProbe }}
        startupProbe: {{- include "probe" $container.startupProbe  | indent 10 }}
        {{- end }}
        {{- if $container.livenessProbe }}
        livenessProbe: {{- include "probe" $container.livenessProbe  | indent 10 }}
        {{- end }}
        {{- if $container.readinessProbe }}
        readinessProbe: {{- include "probe" $container.readinessProbe | indent 10 }}
        {{- end }}
      {{- end }}
