---
env: dev
image: ""
serviceAccount: null

autoscaling:
  enabled: false
  replicas:
    min: 2
    max: 10
  averageUtilization:
    cpu: 80
    memory: 80
  keda:
    enabled: false

monitoring:
  enabled: false
  port: http

externalSecret:
  enabled: true

deployment:
  # Pod scheduling controls (optional). Each is passed through verbatim to the
  # Deployment pod spec, so they take the standard Kubernetes shapes.
  #   affinity: node/pod (anti-)affinity rules
  #   topologySpreadConstraints: even spreading across a topology domain
  #   nodeSelector: pin pods to nodes with matching labels
  #   tolerations: allow scheduling onto tainted nodes
  # Example — keep replicas off the same node:
  #   affinity:
  #     podAntiAffinity:
  #       requiredDuringSchedulingIgnoredDuringExecution:
  #       - labelSelector:
  #           matchLabels:
  #             service: <release-name>
  #         topologyKey: kubernetes.io/hostname
  affinity: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []

  # Rollout strategy (optional), passed through verbatim (standard Kubernetes
  # shape). Omitted, Kubernetes defaults to RollingUpdate.
  # Example — single-replica services that must never run two pods at once:
  #   strategy:
  #     type: Recreate
  strategy: {}

  # Pod volumes (optional), passed through verbatim; pair each entry with a
  # volumeMounts entry on a container.
  #   volumes:
  #     - name: data
  #       persistentVolumeClaim:
  #         claimName: <claim>
  volumes: []

  # Pod security context (optional), passed through verbatim (standard
  # Kubernetes shape). Needed for PVC-backed volumes on SELinux-enforcing
  # nodes (Bottlerocket): fsGroup has kubelet chown the volume on mount, and
  # seLinuxOptions mounts it with a stable label every pod of the service
  # shares — without it each pod gets its own MCS label and files written by
  # one pod are unreadable to the next.
  # Example:
  #   securityContext:
  #     fsGroup: 1000
  #     seLinuxOptions:
  #       level: s0
  securityContext: {}

  containers:
    default:
      resources:
        requests:
          cpu: 200m
        limits:
          memory: 700Mi

      # extra environment variables from ConfigMaps like
      # envConfig;
      #   <ENV_VAR_NAME>: <keyOfValueInConfigMap>
      configMapEnv: {}

      # extra environment variables from Secrets like
      # envSecret;
      #   <ENV_VAR_NAME>: <keyOfValueInSecret>
      secretEnv: {}

      # extra static environment variables like
      # envVars;
      #   <ENV_VAR_NAME>: <envVarValue>
      staticEnv: {}

      # volume mounts (optional), passed through verbatim, e.g.
      #   volumeMounts:
      #     - name: data
      #       mountPath: /data
      volumeMounts: []

      ports:
        http: 3000

      startupProbe:
        failureThreshold: 30
        period: 3
        type: httpGet
        port: http
        path: /

      livenessProbe:
        period: 10
        type: httpGet
        port: http
        path: /

federationSchemaPublish:
  command: null

  # extra environment variables from ConfigMaps like
  # envConfig;
  #   <ENV_VAR_NAME>: <keyOfValueInConfigMap>
  configMapEnv: {}

  # extra environment variables from Secrets like
  # envSecret;
  #   <ENV_VAR_NAME>: <keyOfValueInSecret>
  secretEnv: {}

  # extra static environment variables like
  # envVars;
  #   <ENV_VAR_NAME>: <envVarValue>
  staticEnv: {}

service:
  enabled: true
  type: NodePort

ingress:
  enabled: false
  # pathPrefix accepts either a single string or a list of strings.
  # null or [] mean "no path constraint" (host match only).
  # Examples:
  #   pathPrefix: /api
  #   pathPrefix:
  #     - /api
  #     - /v2
  pathPrefix: null
  hostnames: []
  middlewares: []
